AllCops:
  NewCops: disable
  Exclude:
    - 'spec/app/**/*'
    - 'gemfiles/**/*'

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

Style/RegexpLiteral:
  EnforcedStyle: slashes
  AllowInnerSlashes: true

Style/FrozenStringLiteralComment:
  EnforcedStyle: never
